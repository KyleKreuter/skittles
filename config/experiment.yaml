# Default experiment: two Mistral models competing against a heuristic baseline.
# Requires MISTRAL_API_KEY in the environment (.env). Start small, scale rounds up.
rounds: 50
seed: 42
initial_skittles: 100
fee_rate: 0.1              # house keeps 10% of each side's receipts per trade
max_tool_calls_per_turn: 12
max_cost_usd: 5.0          # hard ceiling per run; LLM agents stop when reached
market_depth: 5

agents:
  - id: mistral-large
    type: llm
    provider: mistral
    model: mistral-large-latest
    temperature: 0.7

  - id: mistral-small
    type: llm
    provider: mistral
    model: mistral-small-latest
    temperature: 0.7

  - id: baseline
    type: heuristic        # free, rule-based reference player
