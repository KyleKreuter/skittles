# Cheap first real run: short, low cost ceiling. Needs MISTRAL_API_KEY.
rounds: 10
seed: 42
initial_skittles: 100
fee_rate: 0.1          # house keeps 10% of each side's receipts per trade
max_tool_calls_per_turn: 8
max_cost_usd: 1.0
market_depth: 5

agents:
  - id: mistral-large
    type: llm
    provider: mistral
    model: mistral-large-latest
    temperature: 0.7

  - id: mistral-small
    type: llm
    provider: mistral
    model: mistral-small-latest
    temperature: 0.7

  - id: baseline
    type: heuristic
