[project]
name = "skittles-exchange"
version = "0.1.0"
description = "KI-Agenten-Trading-Experiment: LLMs handeln Skittles ueber ein Order-Book."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
skittles = "skittles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skittles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
